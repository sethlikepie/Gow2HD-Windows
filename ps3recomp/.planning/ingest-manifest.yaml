# Manifest de ingest para /gsd-ingest-docs — ps3recomp / GoW2
#
# Motivo de existir: a descoberta por convenção de diretório encontra 386
# arquivos (247 deles em .claude/worktrees/, worktrees obsoletas de agentes) e
# tipa como ADR qualquer arquivo com prefixo de data NNNN-, o que faria planos
# já executados — e alguns refutados — entrarem com a precedência MAIS ALTA do
# motor de conflito. Este manifest fixa escopo e tipo explicitamente.
#
# Precedência do motor: ADR > SPEC > PRD > DOC
#   ADR  — decisão de arquitetura travada
#   SPEC — contrato de design técnico
#   PRD  — escopo / roadmap / o que construir
#   DOC  — referência descritiva do que existe
#
# 44 documentos. Exclusões deliberadas registradas no fim deste arquivo.

docs:
  # ─────────────────────────────────────────────────────────────────────
  # ADR — decisões de arquitetura travadas (3)
  #
  # Correção pós-classificação: NID_SYSTEM.md e RECOMP_CONFIG.md estavam
  # aqui na primeira passada. Os classifiers respeitaram o override mas
  # registraram que os sinais de conteúdo apontam DOC — são referência
  # técnica sem seções Context/Decision/Consequences e sem campo de status
  # (RECOMP_CONFIG é explicitamente um stub work-in-progress). Rebaixados
  # para DOC e reclassificados.
  # ─────────────────────────────────────────────────────────────────────
  - path: docs/ARCHITECTURE.md
    type: ADR
  - path: docs/PLATFORM_ABSTRACTION.md
    type: ADR
  - path: docs/RPCS3_AS_REFERENCE.md
    type: ADR

  # ─────────────────────────────────────────────────────────────────────
  # SPEC — contratos de design técnico (1)
  # ─────────────────────────────────────────────────────────────────────
  - path: docs/superpowers/specs/2026-07-25-fase1-desmascarar-memoria-design.md
    type: SPEC

  # ─────────────────────────────────────────────────────────────────────
  # PRD — escopo, roadmap e trabalho em aberto (16)
  # ─────────────────────────────────────────────────────────────────────
  # Índices mestres: é aqui que mora o roadmap de fato.
  - path: docs/superpowers/plans/2026-07-23-00-gow2-playable-master-INDEX.md
    type: PRD
  - path: docs/superpowers/plans/2026-07-20-00-wall-chain-INDEX.md
    type: PRD
  - path: docs/superpowers/plans/2026-07-21-00-macos-metal-stack-INDEX.md
    type: PRD
  - path: docs/superpowers/plans/2026-07-21-00-macos-metal-pending-backlog.md
    type: PRD
  # Trabalho corrente / em aberto.
  - path: docs/superpowers/plans/2026-07-25-00-rdy0-desbloquear-relift.md
    type: PRD
  - path: docs/superpowers/plans/2026-07-25-fase1-desmascarar-memoria.md
    type: PRD
  - path: docs/superpowers/plans/2026-07-24-bringup-instrumentacao-fase0.md
    type: PRD
  - path: docs/superpowers/plans/2026-07-23-menu-type15-frame-loop.md

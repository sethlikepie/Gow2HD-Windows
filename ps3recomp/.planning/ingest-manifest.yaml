#   gow2-asset-pipeline-map.md. Ingeri-los reintroduziria intenções antigas
#   competindo com o estado atual.
#
# docs/superpowers/plans/2026-07-21-macos-metal-{m0..m10 individuais}  (11)
#   Cobertos pelo INDEX do stack Metal e pelo backlog pendente.

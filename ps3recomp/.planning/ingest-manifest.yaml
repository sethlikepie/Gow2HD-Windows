  - path: docs/superpowers/plans/2026-07-23-xenonrecomp-lessons-recomp-tooling.md
    type: PRD
  - path: docs/superpowers/plans/2026-07-21-shader-registry-typemap-walk.md
    type: PRD
  # Planos de escopo do motor.
  - path: docs/MACOS_PORT_PLAN.md
    type: PRD
  - path: docs/IMPLEMENTATION_PLAN_GAME_RUNTIME_BRINGUP.md
    type: PRD
  - path: docs/IMPLEMENTATION_PLAN_RECOMP_RELIABILITY.md
    type: PRD
  - path: docs/PLAN_READY_FOR_GAME_RECOMPILATION.md
    type: PRD
  - path: docs/SPURS_BRINGUP.md

  # ─────────────────────────────────────────────────────────────────────
  # DOC — referência descritiva (24)
  # ─────────────────────────────────────────────────────────────────────
  # Rebaixados de ADR após o veredito dos classifiers (ver nota acima).
  - path: docs/NID_SYSTEM.md
    type: DOC
  - path: docs/RECOMP_CONFIG.md

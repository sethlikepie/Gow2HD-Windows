# gow2_switch_tables.toml -- [[switch_table]] declaradas do GoW2 (NPUA80491)
#
# Consumido por tools/recomp_config.py::load_switch_tables, apontado pela chave
# [main].switch_table_file do gow2_recomp.toml (ao lado deste ficheiro), e
# fundido com ppu_lifter.discover_jump_tables por merge_switch_tables --
# CONFIG GANHA no conflito: um `dispatch` declarado aqui SUBSTITUI o que a
# descoberta encontrou, nao se une a ele.
#
# `dispatch` e' o EA do proprio `bctr`, NAO o da funcao nem o do `mtctr`
# anterior -- e' por esse EA que o ppu_lifter chaveia (self.jump_tables.get(
# insn.addr) com insn == bctr). ARMADILHA MEDIDA (18-01): os EAs do ledger
# PATCH_MIGRATION.tsv (0x002A209C, 0x002B11B8) sao os das FUNCOES; usa-los aqui
# produziria uma declaracao que o lifter aceita e nunca usa.
#
# GERADO (nao editar a mao -- regenerar):
#   .venv/bin/python3 tools/ps3_analyse.py ../gow2-recomp/EBOOT.ELF \
#       --functions ../gow2-recomp/functions.json -o /tmp/gow2_jt_high.toml
# O EBOOT.ELF e o functions.json sao dados do jogo e NUNCA se commitam; deste
# ficheiro so' saem ENDERECOS derivados, nunca conteudo do binario.
#
# POLITICA DE CONTEUDO: so' entram tabelas `high` E revistas por um humano.
# As `low` (14, exigem --include-low) NUNCA entram sem revisao caso a caso e
# razao escrita por tabela -- uma jump table errada nao e' um teste que falha,
# e' o boot a saltar para lixo.
#
# ---------------------------------------------------------------------------
# PORQUE SO' DUAS, E NAO AS 143 `high` -- medido em 2026-08-02 (plano 18-02)
# ---------------------------------------------------------------------------
# Correndo o ps3_analyse e o discover_jump_tables do lifter sobre a MESMA
# imagem e com a mesma assinatura, as 143 tabelas `high` sao IDENTICAS, alvo a
# alvo, as que a descoberta ja' produz sozinha (143 identicas, 0 diferentes,
# 0 so' num dos lados; a descoberta da' 157 = as 143 high + as 14 low).
# Declarar qualquer uma delas e', HOJE, um no-op: o merge substitui a entrada da
# descoberta por outra igual. Nao ha' portanto ganho funcional em despejar as
# 143 -- e havia custo: seriam 141 tabelas que ninguem reviu a entrar num
# ficheiro de producao sob a etiqueta "revisto".
#
# Estas DUAS entram porque sao as unicas com uma terceira fonte independente:
# os patches historicos patch_jumptable_2a209c.py e patch_jumptable_2b11b8.py,
# escritos a mao a partir do lift, cujas tabelas (base 0x002A2134 + 58 offsets
# e base 0x002B1228 + 28 offsets) dao IGUALDADE EXACTA de conjuntos de alvos
# com o que o detector achou -- 54/54 e 22/22 alvos distintos. Concordancia de
# tres analises independentes e' prova; as outras 141 tem duas.
#
# O QUE ISTO VALE HOJE: nada em comportamento -- e esta' dito de proposito, em
# vez de se apresentar a declaracao como se resolvesse algo. O que vale e' ser
# rede: o discover_jump_tables ja' esteve MORTO em HEAD (TypeError/NameError
# apanhados por um try/except que so' imprimia em stderr -> zero jump tables em
# QUALQUER lift, em silencio; ver o docstring da funcao). Declaradas aqui,
# estas duas sobrevivem a uma regressao dessas.
#
# Aceites do ledger cobertos por estas duas (P0):
#   grep:case 0x002A27BCu: goto loc_002A27BC;   (0x002A2134 + 0x688)
#   grep:case 0x002B12C4u: goto loc_002B12C4;   (0x002B1228 + 0x09C)
# NOTA: em 2026-08-02 estes dois greps ja' passam num re-lift limpo SEM patch e
# SEM este ficheiro -- a descoberta chega la' sozinha. A classificacao formal
# (`redundant` vs `migrated`) dos dois patches e' trabalho do plano 18-03.
#
# `confidence` fica no ficheiro: e' metadado do analisador que o parser IGNORA
# (verificado em 18-01), e e' o que permite a revisao humana do TOML.

# mtctr@0x002A212C terminal=bctr base=0x002A2134 modo=offsets bound=57 idx_escalado=True
